name: Collect release evidence
on:
  workflow_run:
    workflows: [Build Windows PHP]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed successful tag build run ID (recovery before a release exists)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false
jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      # This always uses the trusted default branch, never code downloaded from a build artifact.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download original build payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
          pattern: php-*-x64
          path: out/downloaded
      - name: Verify provenance, preserve completed workflow logs, and create draft
        run: python scripts/release.py --run-id "$BUILD_RUN_ID" --payload out/downloaded --output out/release
      - name: Preserve collector diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-collector-${{ env.BUILD_RUN_ID }}
          path: |
            out/release-notes.md
            out/release/release-manifest.json
            out/release/attestation-verification.json
            out/release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 90
